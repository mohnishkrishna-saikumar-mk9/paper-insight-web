version: '3.8'
services:
  backend:
    build: 
      context: ./core/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./core/backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./core
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./core/src:/app/src
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
